[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "pyenrichedheatmap"
version = "0.1.0"
description = "Fast, publication-grade Python equivalent of R's EnrichedHeatmap + ComplexHeatmap horizontal composition for genomics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["genomics", "epigenomics", "heatmap", "bioinformatics", "matplotlib", "chip-seq", "atac-seq"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
stats = [
    "scipy>=1.10",
    "scikit-learn>=1.3",
]
bigwig = [
    "pyBigWig>=0.3.22",
]
pymisha = [
    "pymisha",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/enriched_heatmap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
