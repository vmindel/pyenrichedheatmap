[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "pyenrichedheatmap"
version = "0.2.0"
description = "Enriched heatmaps from pandas DataFrames, drawn on matplotlib axes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vova Mindel", email = "vovamindel@gmail.com" }]
keywords = ["genomics", "epigenomics", "heatmap", "bioinformatics", "matplotlib", "misha", "ChEC-seq", "ChIP-seq", "ATAC-seq"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
stats = [
    "scipy>=1.10",
    "scikit-learn>=1.3",
]
bigwig = [
    "pyBigWig>=0.3.22",
]
pymisha = [
    "pymisha",
]
test = [
    "pytest>=7.4",
    "pyBigWig>=0.3.22",
    "ruff>=0.4",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]
dev = [
    "pytest>=7.4",
    "pyBigWig>=0.3.22",
    "pymisha",
    "ruff>=0.4",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]

[project.scripts]
pyenrichedheatmap-install-skills = "enriched_heatmap._skills.install:main"

[tool.hatch.build.targets.wheel]
packages = ["src/enriched_heatmap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
