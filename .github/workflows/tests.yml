name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          # Linux must have both backends, so their tests cannot silently skip there.
          # Elsewhere they are best effort and skipped where they do not install.
          if [ "${{ runner.os }}" = "Linux" ]; then
            pip install pyBigWig pymisha
          else
            pip install pyBigWig || echo "pyBigWig unavailable; its test will be skipped"
            pip install pymisha || echo "pymisha unavailable; its tests will be skipped"
          fi

      - name: Lint
        run: ruff check src tests docs/run_docs.py

      - name: Type check
        run: mypy src/enriched_heatmap

      - name: Test
        run: pytest -ra

  oldest:
    # The floors declared in pyproject.toml. pandas 2 keeps string IDs as object dtype,
    # a different lookup path from pandas 3, so this job is not redundant.
    name: oldest supported (Python 3.10, pandas 2.0, numpy 1.24, matplotlib 3.7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "pandas==2.0.*" "numpy==1.24.*" "matplotlib==3.7.*" \
            "scipy==1.10.*" "scikit-learn==1.3.*" pytest
          pip install --no-deps -e .

      - name: Test
        run: pytest -ra

  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build strictly
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
          mkdocs build --strict
