site_name: pyenrichedheatmap
site_description: Enriched heatmaps from pandas DataFrames, drawn on matplotlib axes
site_url: https://vmindel.github.io/pyenrichedheatmap/
repo_url: https://github.com/vmindel/pyenrichedheatmap
repo_name: vmindel/pyenrichedheatmap
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Installation: installation.md
  - Tutorials:
      - Quick start: tutorials/quickstart.md
      - Regions to matrices: tutorials/data.md
      - With pymisha: tutorials/pymisha.md
      - Building figures: tutorials/figures.md
      - Coming from R: tutorials/from-r.md
  - Claude Code skill: claude-skill.md
  - API reference:
      - Regions to matrices: api/data.md
      - NormalizedMatrix: api/matrix.md
      - Order and groups: api/ordering.md
      - Drawing: api/drawing.md
      - Layout: api/layout.md
      - Example data: api/datasets.md
      - Skills installer: api/skills.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
